<svg preserveAspectRatio="none" overflow="visible" style="display: block;" width="760" height="520" viewBox="0 0 760 520" fill="none" xmlns="http://www.w3.org/2000/svg">
<title>Perahu Jong — layar, tiang, lambung, dan cadik</title>
<desc>Ekspor Figma node 855:291. Lapisan aslinya tidak bernama (Vector, Vector_2,
dst.); pengelompokan di bawah ditambahkan secara manual berdasarkan kotak batas
dan warna tiap vektor, lalu dicocokkan dengan keempat posisi hotspot. Urutan
gambar TIDAK diubah, jadi tampilannya sama persis dengan ekspor asli. Id asli
tiap vektor dipertahankan supaya ekspor ulang dari Figma mudah dibandingkan.</desc>
